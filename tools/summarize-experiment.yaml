name: summarize-experiment
description: Produce a deterministic statistical summary from experiment runs.
version: 1.0.0
input_schema:
  type: object
  properties:
    experiment_name:
      type: string
      description: Experiment name.
    runs:
      type: array
      description: Run objects containing metric dictionaries.
  required: [experiment_name, runs]
output_schema:
  type: object
implementation:
  type: script
  path: summarize_experiment.py
  runtime: python3
  timeout: 30
annotations:
  read_only: true
  requires_confirmation: false
