name: calculate-metrics
description: Calculate common classification metrics from confusion-matrix counts.
version: 1.0.0
input_schema:
  type: object
  properties:
    true_positive:
      type: integer
      minimum: 0
    true_negative:
      type: integer
      minimum: 0
    false_positive:
      type: integer
      minimum: 0
    false_negative:
      type: integer
      minimum: 0
  required: [true_positive, true_negative, false_positive, false_negative]
output_schema:
  type: object
implementation:
  type: script
  path: calculate_metrics.py
  runtime: python3
  timeout: 30
annotations:
  read_only: true
  requires_confirmation: false
