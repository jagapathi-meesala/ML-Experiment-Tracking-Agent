name: register-artifact
description: Register metadata for a local experiment artifact without copying or executing it.
version: 1.0.0
input_schema:
  type: object
  properties:
    path:
      type: string
      description: Absolute path to an existing artifact file.
    artifact_type:
      type: string
      description: Artifact type such as model, dataset, report, or log.
  required: [path, artifact_type]
output_schema:
  type: object
implementation:
  type: script
  path: register_artifact.py
  runtime: python3
  timeout: 30
annotations:
  read_only: false
  requires_confirmation: false
